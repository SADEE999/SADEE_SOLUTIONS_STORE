name: SADEE SOLUTIONS STORE - Extract ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIP to Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found."
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "✅ ZIP extracted."
          find extracted -maxdepth 3 -type f | sort

      - name: Find website folder
        id: find_project
        shell: bash
        run: |
          set -e

          if [ -f "extracted/index.html" ]; then
            PROJECT="extracted"
          else
            PROJECT=$(find extracted -type f -name "index.html" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "❌ index.html not found."
            exit 1
          fi

          echo "✅ Website folder: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Copy website files
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.find_project.outputs.project }}"

          echo "Copying website..."

          cp -a "$PROJECT"/. .

          rm -rf extracted

          echo "Removing uploaded ZIP..."
          rm -f ./*.zip

          echo "✅ Website files copied."

      - name: Show final files
        shell: bash
        run: |
          echo "===== FINAL WEBSITE ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" | sort

      - name: Commit extracted website
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "Extract SADEE SOLUTIONS STORE"
            git push
            echo "✅ Extracted website pushed to main."
          fi
