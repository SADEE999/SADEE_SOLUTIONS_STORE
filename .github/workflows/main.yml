name: SADEE SOLUTIONS STORE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-store:
    name: Check Store Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check website
        run: |
          set -e

          echo "===== SADEE SOLUTIONS STORE ====="

          if [ ! -f "index.html" ]; then
            echo "❌ index.html not found"
            exit 1
          fi

          echo "✅ index.html found"

          if [ -f "styles.css" ]; then
            echo "✅ styles.css found"
          fi

          if [ -f "app.js" ]; then
            echo "✅ app.js found"
          fi

          if [ -f "config.js" ]; then
            echo "✅ config.js found"
          fi

          if [ -d "admin" ]; then
            echo "✅ admin folder found"
          fi

          if [ -d "assets" ]; then
            echo "✅ assets folder found"
          fi

          echo ""
          echo "===== WEBSITE FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "================================"
          echo "✅ SADEE SOLUTIONS STORE READY"
          echo "================================"
